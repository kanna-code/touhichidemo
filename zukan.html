<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <title>ラーメン図鑑 - らぁ麺 とうひち</title>
    <style>
        :root {
            --gold: #c8a84b;
            --gold-light: #e2c97e;
            --gold-dim: rgba(200,168,75,0.18);
            --bg: #faf8f3;
            --bg-card: #ffffff;
            --bg-photo: #f0ebe0;
            --cream: #f5f0e8;
            --cream2: #ede6d8;
            --text-dark: #1a1410;
            --text-mid: #5a5045;
            --text-light: #8a7a6a;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--bg);
            color: var(--text-dark);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
           HEADER
        ============================================================ */
        .zukan-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 900;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(250,248,243,0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(200,168,75,0.25);
        }

        .zukan-header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .zukan-header-logo img {
            height: 40px;
            width: auto;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(200,168,75,0.8);
            text-decoration: none;
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            font-family: 'Noto Serif JP', serif;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--gold-light); }

        /* ============================================================
           HERO
        ============================================================ */
        .zukan-hero {
            padding: 120px 20px 64px;
            text-align: center;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(200,168,75,0.12) 0%, transparent 65%),
                var(--bg);
            border-bottom: 1px solid rgba(200,168,75,0.22);
        }

        .zukan-hero-en {
            font-family: 'Noto Serif JP', serif;
            font-size: 0.65rem;
            letter-spacing: 0.45em;
            color: rgba(200,168,75,0.6);
            text-transform: uppercase;
            margin-bottom: 14px;
            display: block;
        }

        .zukan-hero-title {
            font-family: 'Noto Serif JP', serif;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--text-dark);
            margin-bottom: 20px;
        }

        .zukan-hero-desc {
            font-size: 0.82rem;
            color: var(--text-light);
            line-height: 2;
            max-width: 480px;
            margin: 0 auto;
        }

        .gold-line {
            display: block;
            width: 40px;
            height: 1px;
            background: var(--gold);
            margin: 20px auto 0;
            opacity: 0.6;
        }

        /* ============================================================
           フィルターバー
        ============================================================ */
        .filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 32px 20px 20px;
        }

        .filter-btn {
            padding: 7px 18px;
            border: 1px solid rgba(200,168,75,0.45);
            background: transparent;
            color: var(--text-mid);
            font-family: 'Noto Serif JP', serif;
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.22s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--gold);
            border-color: var(--gold);
            color: #fff;
        }

        /* ソートバー */
        .sort-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 0 20px 28px;
        }

        .sort-label {
            font-size: 0.62rem;
            letter-spacing: 0.22em;
            color: rgba(200,168,75,0.38);
            font-family: 'Noto Serif JP', serif;
        }

        .sort-btn {
            padding: 5px 16px;
            border: 1px solid rgba(200,168,75,0.35);
            background: transparent;
            color: var(--text-light);
            font-family: 'Noto Serif JP', serif;
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sort-btn:hover { border-color: rgba(200,168,75,0.6); color: var(--gold); }

        .sort-btn.active {
            background: rgba(200,168,75,0.12);
            border-color: var(--gold);
            color: var(--gold);
        }

        /* ============================================================
           図鑑グリッド
        ============================================================ */
        .zukan-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-width: 1080px;
            margin: 0 auto;
            padding: 12px 12px 80px;
        }

        @media (min-width: 900px) {
            .zukan-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 12px 16px 80px; }
        }

        /* ============================================================
           図鑑カード
        ============================================================ */
        .zukan-card {
            background: var(--bg-card);
            border: 1px solid rgba(200,168,75,0.22);
            border-radius: 4px;
            overflow: hidden;
            transition: border-color 0.3s, transform 0.35s ease, box-shadow 0.35s ease;
            cursor: pointer;
            margin-bottom: 1px;
        }

        @media (min-width: 600px) { .zukan-card { margin-bottom: 0; } }

        .zukan-card:hover {
            border-color: rgba(200,168,75,0.55);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(180,140,50,0.12);
        }

        .zukan-card-photo {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            position: relative;
            background: var(--bg-photo);
        }

        .zukan-card-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.55s ease;
        }

        .zukan-card:hover .zukan-card-photo img {
            transform: scale(1.05);
        }

        .zukan-card-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 10px;
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(200,168,75,0.45);
            color: #a07828;
            font-size: 0.62rem;
            letter-spacing: 0.2em;
            font-family: 'Noto Serif JP', serif;
            border-radius: 2px;
        }

        .zukan-card-body {
            padding: 18px 16px 20px;
        }

        .zukan-card-period {
            font-size: 0.62rem;
            letter-spacing: 0.18em;
            color: rgba(200,168,75,0.55);
            font-family: 'Noto Serif JP', serif;
            margin-bottom: 8px;
            display: block;
        }

        .zukan-card-name {
            font-family: 'Noto Serif JP', serif;
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: 0.04em;
            line-height: 1.55;
            margin-bottom: 6px;
        }

        .zukan-card-price {
            font-family: 'Noto Serif JP', serif;
            font-size: 0.9rem;
            color: var(--gold);
            letter-spacing: 0.04em;
            margin-bottom: 14px;
            display: block;
        }

        .zukan-card-divider {
            width: 100%;
            height: 1px;
            background: rgba(200,168,75,0.25);
            margin-bottom: 14px;
        }

        .zukan-detail-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .zukan-detail-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .zukan-detail-label {
            font-size: 0.6rem;
            letter-spacing: 0.28em;
            color: rgba(200,168,75,0.55);
            font-family: 'Noto Serif JP', serif;
            text-transform: uppercase;
        }

        .zukan-detail-text {
            font-size: 0.78rem;
            color: var(--text-mid);
            line-height: 1.8;
        }

        /* ============================================================
           モーダル
        ============================================================ */
        .zukan-modal {
            position: fixed;
            inset: 0;
            z-index: 9000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(0,0,0,0);
            pointer-events: none;
            transition: background 0.3s;
        }

        .zukan-modal.open {
            background: rgba(0,0,0,0.88);
            pointer-events: all;
        }

        .zukan-modal-inner {
            background: var(--bg-card);
            border: 1px solid rgba(200,168,75,0.3);
            border-radius: 6px;
            width: 100%;
            max-width: 680px;
            max-height: 88vh;
            overflow-y: auto;
            transform: translateY(24px) scale(0.97);
            opacity: 0;
            transition: transform 0.32s cubic-bezier(0.34,1.56,0.64,1), opacity 0.28s;
        }

        .zukan-modal.open .zukan-modal-inner {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .zukan-modal-photo {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
        }

        .zukan-modal-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .zukan-modal-body {
            padding: 24px 20px 28px;
        }

        .zukan-modal-period {
            font-size: 0.62rem;
            letter-spacing: 0.2em;
            color: rgba(200,168,75,0.55);
            font-family: 'Noto Serif JP', serif;
            margin-bottom: 8px;
            display: block;
        }

        .zukan-modal-name {
            font-family: 'Noto Serif JP', serif;
            font-size: clamp(1.2rem, 3vw, 1.55rem);
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: 0.04em;
            line-height: 1.5;
            margin-bottom: 6px;
        }

        .zukan-modal-price {
            font-family: 'Noto Serif JP', serif;
            font-size: 1rem;
            color: var(--gold);
            margin-bottom: 20px;
            display: block;
        }

        .zukan-modal-divider {
            width: 100%;
            height: 1px;
            background: rgba(200,168,75,0.28);
            margin-bottom: 20px;
        }

        .zukan-modal-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            .zukan-modal-details { grid-template-columns: 1fr; }
        }

        .zukan-modal-label {
            font-size: 0.6rem;
            letter-spacing: 0.28em;
            color: rgba(200,168,75,0.55);
            font-family: 'Noto Serif JP', serif;
            margin-bottom: 5px;
            display: block;
        }

        .zukan-modal-text {
            font-size: 0.82rem;
            color: var(--text-mid);
            line-height: 1.9;
        }

        .zukan-modal-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid rgba(200,168,75,0.35);
            color: var(--gold);
            font-family: 'Noto Serif JP', serif;
            font-size: 0.78rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            border-radius: 3px;
            margin-top: 8px;
            transition: all 0.22s;
        }

        .zukan-modal-close:hover {
            background: rgba(200,168,75,0.1);
            border-color: var(--gold);
        }

        /* ============================================================
           フッター
        ============================================================ */
        .zukan-footer {
            text-align: center;
            padding: 32px 20px;
            border-top: 1px solid rgba(200,168,75,0.22);
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            color: var(--text-light);
            font-family: 'Noto Serif JP', serif;
        }

        /* ============================================================
           ランキング・いいね
        ============================================================ */
        .rank-badge {
            position: absolute;
            top: 10px; right: 10px;
            width: 40px; height: 40px;
            border-radius: 50%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Serif JP', serif;
            text-align: center;
            line-height: 1.1;
        }
        .rank-badge.show { display: flex; }
        .rank-badge.r1 { background: var(--gold); color: #fff; box-shadow: 0 2px 12px rgba(200,168,75,0.4); }
        .rank-badge.r2 { background: #b0b0b0; color: #fff; }
        .rank-badge.r3 { background: #b06a2e; color: #fff; }
        .rank-badge .rn { font-size: 0.9rem; font-weight: 900; }
        .rank-badge .rl { font-size: 0.42rem; letter-spacing: 0.06em; }

        .zukan-card.top1 { border-color: rgba(200,168,75,0.55); }
        .zukan-card.top2 { border-color: rgba(190,190,190,0.38); }
        .zukan-card.top3 { border-color: rgba(176,106,46,0.38); }

        .card-like-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(200,168,75,0.2);
        }

        .like-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            background: none;
            border: 1px solid rgba(200,168,75,0.35);
            border-radius: 40px;
            padding: 6px 14px 6px 10px;
            cursor: pointer;
            color: var(--text-light);
            user-select: none;
            transition: border-color 0.2s, background 0.2s, color 0.2s;
        }
        .like-btn:hover { border-color: var(--gold); color: var(--gold); }
        .like-btn.liked { border-color: var(--gold); background: rgba(200,168,75,0.1); color: var(--gold); }

        .like-heart {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            transition: fill 0.2s, stroke 0.2s;
            flex-shrink: 0;
        }
        .like-btn.liked .like-heart { fill: var(--gold); stroke: var(--gold); }

        .like-count {
            font-size: 0.8rem;
            font-family: 'Noto Serif JP', serif;
            min-width: 1ch;
        }

        @keyframes heartPop {
            0%   { transform: scale(1); }
            35%  { transform: scale(1.5); }
            65%  { transform: scale(0.88); }
            100% { transform: scale(1); }
        }
        .like-heart.pop { animation: heartPop 0.32s ease forwards; }

        /* ローディング */
        .zukan-loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            font-family: 'Noto Serif JP', serif;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            color: var(--text-light);
        }

        /* フェードイン */
        .fade-in {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="zukan-header">
        <a href="index.html" class="zukan-header-logo">
            <img src="logo.png" alt="らぁ麺 とうひち">
        </a>
        <a href="index.html" class="back-link">
            ← サイトに戻る
        </a>
    </header>

    <!-- ヒーロー -->
    <div class="zukan-hero">
        <span class="zukan-hero-en">Ramen Archive</span>
        <h1 class="zukan-hero-title">ラーメン図鑑</h1>
        <p class="zukan-hero-desc">週替わり・季節限定で提供してきた一杯の記録。それぞれの出会いと旨みを、ここに残します。</p>
        <span class="gold-line"></span>
    </div>

    <!-- フィルターバー -->
    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">すべて</button>
        <button class="filter-btn" data-filter="醤油">醤油</button>
        <button class="filter-btn" data-filter="塩">塩</button>
        <button class="filter-btn" data-filter="煮干">煮干</button>
        <button class="filter-btn" data-filter="冷やし">冷やし</button>
        <button class="filter-btn" data-filter="まぜそば">まぜそば</button>
        <button class="filter-btn" data-filter="その他">その他</button>
    </div>

    <!-- ソートバー -->
    <div class="sort-bar">
        <span class="sort-label">並び替え</span>
        <button class="sort-btn active" data-sort="newest">最新順</button>
        <button class="sort-btn" data-sort="likes">いいね順</button>
    </div>

    <!-- 図鑑グリッド -->
    <div class="zukan-grid" id="zukanGrid">
        <p class="zukan-loading" id="zukanLoading">読み込み中…</p>
    </div>

    <!-- モーダル -->
    <div class="zukan-modal" id="zukanModal">
        <div class="zukan-modal-inner">
            <div class="zukan-modal-photo">
                <img id="modalPhoto" src="" alt="">
            </div>
            <div class="zukan-modal-body">
                <span class="zukan-modal-period" id="modalPeriod"></span>
                <h2 class="zukan-modal-name" id="modalName"></h2>
                <span class="zukan-modal-price" id="modalPrice"></span>
                <div class="zukan-modal-divider"></div>
                <div class="zukan-modal-details">
                    <div>
                        <span class="zukan-modal-label">スープ</span>
                        <p class="zukan-modal-text" id="modalSoup"></p>
                    </div>
                    <div>
                        <span class="zukan-modal-label">麺・トッピング</span>
                        <p class="zukan-modal-text" id="modalNoodle"></p>
                    </div>
                </div>
                <button class="zukan-modal-close" id="modalClose">閉じる　↑</button>
            </div>
        </div>
    </div>

    <!-- フッター -->
    <footer class="zukan-footer">
        © らぁ麺 とうひち　Ramen Tohichi, Kyoto
    </footer>

    <script>
        // ============================================================
        //  ▼ Google スプレッドシートの「CSVとして公開」URLをここに貼る
        // ============================================================
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTPBloT2IWIwTwncTZZxpiBj-aHSMfJVlHi1Zmr_G74lWHEmRcL4yhJ6v2j2QgTICGnfKw-c_M-XBdd/pub?gid=0&single=true&output=csv';

        // フェードイン
        const io = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
        }, { threshold: 0.08 });
        document.querySelectorAll('.fade-in').forEach(el => io.observe(el));

        // ============================================================
        //  いいね & ランキング & ソート
        // ============================================================
        const LIKES_KEY = 'touhichi_zukan_likes';
        const LIKED_KEY = 'touhichi_zukan_liked';

        let likes = JSON.parse(localStorage.getItem(LIKES_KEY) || '{}');
        let liked = JSON.parse(localStorage.getItem(LIKED_KEY) || '{}');
        let currentSort = 'newest';
        let currentFilter = 'all';

        function save() {
            localStorage.setItem(LIKES_KEY, JSON.stringify(likes));
            localStorage.setItem(LIKED_KEY, JSON.stringify(liked));
        }

        function parsePeriod(period) {
            const m = period.match(/(\d+)年(\d+)月/);
            return m ? parseInt(m[1]) * 100 + parseInt(m[2]) : 0;
        }

        function toggleLike(e, id, btn) {
            e.stopPropagation();
            const isLiked = !!liked[id];
            liked[id] = !isLiked;
            likes[id] = Math.max(0, (likes[id] || 0) + (isLiked ? -1 : 1));
            save();
            renderLikeBtn(id, btn);
            if (!isLiked) {
                const heart = btn.querySelector('.like-heart');
                heart.classList.remove('pop');
                void heart.offsetWidth;
                heart.classList.add('pop');
                heart.addEventListener('animationend', () => heart.classList.remove('pop'), { once: true });
            }
            sortAndRank();
        }

        function renderLikeBtn(id, btn) {
            btn.querySelector('.like-count').textContent = likes[id] || 0;
            btn.classList.toggle('liked', !!liked[id]);
        }

        function sortAndRank() {
            const grid = document.getElementById('zukanGrid');
            const allCards = [...document.querySelectorAll('.zukan-card')];

            if (currentSort === 'newest') {
                allCards.sort((a, b) => parsePeriod(b.dataset.period) - parsePeriod(a.dataset.period));
                // ランクバッジ・枠色をクリア
                allCards.forEach(card => {
                    card.classList.remove('top1','top2','top3');
                    const badge = document.getElementById('rank-' + card.dataset.id);
                    badge.className = 'rank-badge';
                    badge.innerHTML = '';
                });
            } else {
                allCards.sort((a, b) => (likes[b.dataset.id] || 0) - (likes[a.dataset.id] || 0));
                allCards.forEach((card, i) => {
                    const id    = card.dataset.id;
                    const badge = document.getElementById('rank-' + id);
                    const count = likes[id] || 0;
                    badge.className = 'rank-badge';
                    badge.innerHTML = '';
                    card.classList.remove('top1','top2','top3');
                    if (count > 0 && i < 3) {
                        badge.classList.add('show', ['r1','r2','r3'][i]);
                        badge.innerHTML = `<span class="rn">${i+1}</span><span class="rl">位</span>`;
                        card.classList.add(['top1','top2','top3'][i]);
                    }
                });
            }

            allCards.forEach(card => {
                const show = currentFilter === 'all' || card.dataset.filter === currentFilter;
                card.style.display = show ? '' : 'none';
                grid.appendChild(card);
            });
        }

        // ============================================================
        //  CSV パース & カード生成
        // ============================================================
        function parseCSV(text) {
            const rows = [];
            let row = [], field = '', inQuote = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (inQuote) {
                    if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQuote = false; }
                    else field += c;
                } else {
                    if (c === '"') inQuote = true;
                    else if (c === ',') { row.push(field); field = ''; }
                    else if (c === '\n') { row.push(field); if (row.some(f => f)) rows.push(row); row = []; field = ''; }
                    else if (c !== '\r') field += c;
                }
            }
            if (row.length) { row.push(field); if (row.some(f => f)) rows.push(row); }
            return rows;
        }

        function renderCards(dataRows) {
            const grid = document.getElementById('zukanGrid');
            const loading = document.getElementById('zukanLoading');
            if (loading) loading.remove();

            dataRows.forEach(row => {
                // 列: ID | 提供時期 | 名前 | 価格 | タグ | フィルター | 写真ファイル名 | スープ説明 | 麺・トッピング
                const [id, period, name, price, tag, filter, photo, soup, noodle] = row.map(f => f.trim());
                if (!id || !name) return;

                const shortSoup   = soup.length   > 20 ? soup.slice(0, 20)   + '…' : soup;
                const shortNoodle = noodle.length > 20 ? noodle.slice(0, 20) + '…' : noodle;

                const card = document.createElement('div');
                card.className = 'zukan-card fade-in';
                card.dataset.id     = id;
                card.dataset.filter = filter || 'その他';
                card.dataset.period = period;
                card.dataset.name   = name;
                card.dataset.price  = price;
                card.dataset.tag    = tag;
                card.dataset.photo  = photo;
                card.dataset.soup   = soup;
                card.dataset.noodle = noodle;

                card.innerHTML = `
                    <div class="zukan-card-photo">
                        <img src="${photo}" alt="" loading="lazy">
                        ${tag ? `<span class="zukan-card-tag">${tag}</span>` : ''}
                        <span class="rank-badge" id="rank-${id}"></span>
                    </div>
                    <div class="zukan-card-body">
                        <span class="zukan-card-period">${period}</span>
                        <h2 class="zukan-card-name">${name}</h2>
                        <span class="zukan-card-price">${price}</span>
                        <div class="zukan-card-divider"></div>
                        <div class="zukan-detail-row">
                            <div class="zukan-detail-item">
                                <span class="zukan-detail-label">スープ</span>
                                <span class="zukan-detail-text">${shortSoup}</span>
                            </div>
                            <div class="zukan-detail-item">
                                <span class="zukan-detail-label">麺・具材</span>
                                <span class="zukan-detail-text">${shortNoodle}</span>
                            </div>
                        </div>
                        <div class="card-like-row">
                            <button class="like-btn" aria-label="いいね">
                                <svg class="like-heart" viewBox="0 0 24 24" width="17" height="17"><path d="M12 21C12 21 3 13.5 3 8a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 5.5-9 13-9 13z"/></svg>
                                <span class="like-count">0</span>
                            </button>
                        </div>
                    </div>`;

                card.querySelector('.like-btn').addEventListener('click', e => {
                    e.stopPropagation();
                    toggleLike(e, id, card.querySelector('.like-btn'));
                });

                grid.appendChild(card);
                io.observe(card);
            });

            document.querySelectorAll('.zukan-card').forEach(card => {
                renderLikeBtn(card.dataset.id, card.querySelector('.like-btn'));
            });
            sortAndRank();
        }

        async function fetchAndRender() {
            try {
                const res  = await fetch(SHEET_URL);
                const text = await res.text();
                const rows = parseCSV(text).slice(1); // 1行目はヘッダーなのでスキップ
                renderCards(rows);
            } catch (err) {
                const el = document.getElementById('zukanLoading');
                if (el) el.textContent = 'データの読み込みに失敗しました。';
                console.error(err);
            }
        }

        fetchAndRender();

        // ============================================================
        //  フィルター
        // ============================================================
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                sortAndRank();
            });
        });

        // ============================================================
        //  ソート
        // ============================================================
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSort = btn.dataset.sort;
                sortAndRank();
            });
        });

        // ============================================================
        //  モーダル
        // ============================================================
        const modal = document.getElementById('zukanModal');
        const modalClose = document.getElementById('modalClose');

        function openModal(card) {
            document.getElementById('modalPhoto').src  = card.dataset.photo;
            document.getElementById('modalPhoto').alt  = card.dataset.name;
            document.getElementById('modalPeriod').textContent = card.dataset.period;
            document.getElementById('modalName').textContent   = card.dataset.name;
            document.getElementById('modalPrice').textContent  = card.dataset.price;
            document.getElementById('modalSoup').textContent   = card.dataset.soup;
            document.getElementById('modalNoodle').textContent = card.dataset.noodle;
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('open');
            document.body.style.overflow = '';
        }

        document.getElementById('zukanGrid').addEventListener('click', e => {
            const card = e.target.closest('.zukan-card');
            if (card && !e.target.closest('.like-btn')) openModal(card);
        });
        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    </script>

</body>
</html>
